<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SOC Dashboard</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: 'Courier New'; padding: 20px; }
        .nav-buttons { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        button { 
            background: #262626; color: #00ff00; border: 1px solid #00ff00; 
            padding: 10px 20px; cursor: pointer; font-family: 'Courier New';
        }
        button.active { background: #00ff00; color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .alert-card { border-left: 5px solid #ff0000; background: #262626; margin: 10px 0; padding: 15px; }
        .log-container { background: #000; padding: 15px; height: 500px; overflow-y: auto; color: #aaa; font-size: 0.9em; }
        .time { color: #888; }
    </style>
</head>
<body>
    <h1>🛡️ SOC MONITORING SYSTEM</h1>

    <div class="nav-buttons">
        <button id="btn-alerts" class="active" onclick="showTab('alerts')">🚨 ALERTAS ATIVOS</button>
        <button id="btn-logs" onclick="showTab('logs')">📜 LOGS DE AUDITORIA</button>
        <a href="/api/reset_firewall" target="_blank"><button style="border-color: #ff0000; color: #ff0000;">🔓 RESET IP</button></a>
    </div>

    <div id="tab-alerts" class="tab-content active">
        <div id="alerts-list"></div>
    </div>

    <div id="tab-logs" class="tab-content">
        <div id="logs-list" class="log-container"></div>
    </div>

    <script>
        function showTab(tabName) {
            // Alterna visibilidade das divs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // Alterna estilo dos botões
            document.querySelectorAll('button').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        async function updateData() {
            // Atualiza Alertas
            const resAlerts = await fetch('/api/alerts');
            const alerts = await resAlerts.json();
            document.getElementById('alerts-list').innerHTML = alerts.map(a => `
                <div class="alert-card">
                    <span class="time">[${a.time}]</span> <b>${a.type}</b>: ${a.message}
                </div>
            `).join('');

            // Atualiza Logs
            const resLogs = await fetch('/api/logs');
            const logs = await resLogs.json();
            document.getElementById('logs-list').innerHTML = logs.map(l => `<div>> ${l}</div>`).join('');
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
