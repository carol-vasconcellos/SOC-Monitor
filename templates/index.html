<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Dashboard</title>
    <meta http-equiv="refresh" content="5"> <style>
        body { background: #1a1a1a; color: #00ff00; font-family: 'Courier New'; padding: 20px; }
        .alert-card { border-left: 5px solid #ff0000; background: #262626; margin: 10px 0; padding: 15px; }
        .time { color: #888; font-size: 0.8em; }
        .type-MODIFICAÇÃO { color: #ffa500; }
        .type-CRÍTICO { color: #ff0000; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛡️ SOC MONITORING DASHBOARD</h1>
    
    <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
            <h2>🚨 ALERTAS ATIVOS</h2>
            <div id="alerts"></div>
        </div>

        <div style="flex: 1; border-left: 1px solid #333; padding-left: 20px;">
            <h2>📜 LOGS DE AUDITORIA (soc_audit.log)</h2>
            <div id="logs" style="font-size: 0.85em; color: #aaa; background: #000; padding: 10px; height: 500px; overflow-y: auto;">
                </div>
        </div>
    </div>

    <script>
        // Função para carregar Alertas (sua função original)
        async function loadAlerts() {
            const response = await fetch('/api/alerts');
            const data = await response.json();
            const div = document.getElementById('alerts');
            div.innerHTML = data.map(a => `
                <div class="alert-card">
                    <span class="time">[${a.time}]</span> 
                    <span class="type-${a.type}">${a.type}</span>: ${a.message}
                </div>
            `).join('');
        }

        // NOVA FUNÇÃO: Carregar Logs do arquivo
        async function loadLogs() {
            const response = await fetch('/api/logs');
            const data = await response.json();
            const div = document.getElementById('logs');
            // Formata as linhas de log para visualização
            div.innerHTML = data.map(line => `<div>> ${line}</div>`).join('');
            // Auto-scroll para o final do log
            div.scrollTop = div.scrollHeight;
        }

        // Atualização contínua
        setInterval(() => {
            loadAlerts();
            loadLogs();
        }, 2000);

        loadAlerts();
        loadLogs();
    </script>
</body>
</html>
