<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SOC Monitoring Dashboard</title>
    <style>
        body { background: #0d0d0d; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        h1 { border-bottom: 2px solid #00ff41; padding-bottom: 10px; text-shadow: 0 0 10px #00ff41; }
        
        .nav-buttons { margin-bottom: 25px; }
        button { 
            background: #1a1a1a; color: #00ff41; border: 1px solid #00ff41; 
            padding: 12px 24px; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        button:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
        button.active { background: #00ff41; color: #000; font-weight: bold; }
        
        .tab-content { display: none; background: #141414; border: 1px solid #333; padding: 20px; min-height: 400px; border-radius: 5px; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }

        .alert-card { border-left: 4px solid #ff4444; background: #1a1a1a; margin-bottom: 12px; padding: 15px; border-radius: 0 5px 5px 0; }
        .log-line { color: #00ccff; border-bottom: 1px solid #222; padding: 5px 0; font-size: 13px; }
        .log-line:nth-child(even) { color: #ffffff; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h1>🛡️ SOC MONITORING SYSTEM v3.0</h1>

    <div class="nav-buttons">
        <button id="btn-alerts" class="active" onclick="showTab('alerts')">🚨 ALERTAS EM TEMPO REAL</button>
        <button id="btn-logs" onclick="showTab('logs')">📜 AUDITORIA DE LOGS</button>
    </div>

    <div id="tab-alerts" class="tab-content active">
        <div id="alerts-list"></div>
    </div>

    <div id="tab-logs" class="tab-content">
        <div id="logs-list"></div>
    </div>

    <script>
        function showTab(tabName) {
            // Esconde todas as abas
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Mostra a aba clicada
            document.getElementById('tab-' + tabName).classList.add('active');
            
            // Muda o estilo dos botões
            document.querySelectorAll('button').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        async function updateData() {
            try {
                // Busca Alertas
                const resAlerts = await fetch('/api/alerts');
                const alerts = await resAlerts.json();
                document.getElementById('alerts-list').innerHTML = alerts.map(a => `
                    <div class="alert-card">
                        <span style="color:#888;">[${a.time}]</span> 
                        <b style="color:#ff4444;">${a.type}</b>: ${a.message}
                    </div>
                `).join('');

                // Busca Logs do arquivo soc_audit.log
                const resLogs = await fetch('/api/logs');
                const logs = await resLogs.json();
                document.getElementById('logs-list').innerHTML = logs.map(l => `
                    <div class="log-line">> ${l}</div>
                `).join('');
            } catch (e) { console.error("Erro na atualização:", e); }
        }

        // Atualiza a cada 2 segundos
        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
